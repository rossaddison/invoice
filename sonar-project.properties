sonar.projectKey=rossaddison_inv
sonar.organization=rossaddison
sonar.projectName=Invoice Application (inv)
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# Analysis scope
# SonarCloud's "new analysis scope" analyses the WHOLE project and ignores
# sonar.sources, sonar.tests and sonar.test.inclusions (it warns that they "have
# no effect"). The scope this project has always been measured on is src/,
# config/ and public/, so that scope is now expressed as exclusions instead:
# every other top-level directory, every file in the repository root, and the
# co-located TypeScript tests (src/typescript/foo.test.ts beside foo.ts). Test
# files must stay out of the source scope: a *.test.ts scored as ordinary
# source needs its own test coverage, which is nonsensical for a test file and
# silently inflates the new-code coverage bar on any PR that adds or grows one.
# The same applies to Tests/ (PHP) and playwright/ (browser) -- they are tests,
# not code that needs tests. resources/ (view templates and translations),
# docs/, bin/ and the CI/tooling directories were never part of the measured
# scope either.
sonar.php.coverage.reportPaths=coverage.xml,coverage-testo.xml
sonar.php.tests.reportPath=test-results.xml
sonar.exclusions=vendor/**,runtime/**,public/assets/**,nbproject/**,docker/**,src/Invoice/Asset/**,e.g.ini/**,resources/**,Tests/**,playwright/**,benchmarks/**,bin/**,docs/**,monitoring/**,oxalis-mock/**,private/**,.claude/**,.githooks/**,.github/**,.vscode/**,src/typescript/**/*.test.ts,*,**/*.png,**/*.jpg,**/*.jpeg,**/*.ico,**/*.gif,**/*.webp,**/*.bmp,**/*.tiff,**/*.svg

# Language versions
sonar.php.version=8.4

sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5
sonar.issue.ignore.multicriteria.e1.ruleKey=php:S116
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.php
sonar.issue.ignore.multicriteria.e2.ruleKey=php:S1068
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.php
sonar.issue.ignore.multicriteria.e4.ruleKey=php:S1125
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*.php
sonar.issue.ignore.multicriteria.e3.ruleKey=php:S1192
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.php
# ip-api.com's free tier is HTTP-only (HTTPS requires a paid plan); only a
# bare IP is ever sent, never anything sensitive, and only as the fallback
# after ipapi.co — see GeoIpLookupService's own class docblock. Scoped to
# this one file, not a project-wide S5332 exemption.
sonar.issue.ignore.multicriteria.e5.ruleKey=php:S5332
sonar.issue.ignore.multicriteria.e5.resourceKey=src/Redirect/GeoIpLookupService.php
# config/common/routes/routes-setting-toggle.php: every route in this file
# follows the same Route::methods(...)->name(...)->middleware(...)->action(...)
# shape by design (Yiisoft\Router's own idiom) -- CPD flagging two adjacent,
# structurally-identical 4-line route registrations here isn't a real
# duplication problem, it's what every route in this file already looks like.
sonar.cpd.exclusions=src/Invoice/Helpers/Peppol/**,src/Invoice/Helpers/StoreCove/StoreCoveArrays.php,src/Widget/SalesOrderToolbar.php,config/common/routes/routes-setting-toggle.php
sonar.javascript.lcov.reportPaths=coverage/lcov.info

on:
  workflow_dispatch:

  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.gitignore'
      - '.gitattributes'
      - 'infection.json.dist'
      - 'psalm.xml'

  push:    
    branches: ['main']    
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.gitignore'
      - '.gitattributes'
      - 'infection.json.dist'
      - 'psalm.xml'

  schedule:
    - cron: '0 0 * * *'

name: invoice build

jobs:
  # Built once on PHP 8.4/ubuntu-latest and shared via artifact with both
  # `sonar` and every `tests` matrix leg (PHP 8.4 and 8.5, ubuntu and
  # windows) below, instead of each of those 5 jobs independently running
  # its own full `composer install` from scratch. composer.lock is
  # committed, so `composer install` (not `update`) always produces the
  # exact same vendor/ regardless of which PHP version or OS runs it.
  #
  # Not shared with tests-alpine: that job runs under musl libc rather
  # than glibc, installs PHP via apk rather than shivammathur/setup-php,
  # and is a single leg with no matrix redundancy of its own to eliminate
  # — kept fully independent rather than risking a glibc/musl mismatch for
  # no real benefit.
  #
  # Windows note for whoever adds real test-running steps to the `tests`
  # job later (see that job's own comment): vendor/bin/*'s wrapper scripts
  # are OS-specific (.bat on Windows, shell script elsewhere) and are
  # baked in at `composer install` time for whatever OS ran it — this
  # artifact is built on ubuntu-latest, so its vendor/bin/*.bat wrappers
  # don't exist. Invoke tools via `php vendor/bin/x` explicitly rather
  # than relying on the wrapper script working after downloading this
  # artifact on a Windows leg.
  install:
    name: Install Composer dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Composer GitHub auth
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: composer config --global --auth github-oauth.github.com "$GITHUB_TOKEN"

      - name: Install PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: apcu, fileinfo, pdo, pdo_sqlite, intl, gd, openssl, dom, json, mbstring, curl, uopz, sodium, ctype
          tools: composer:v2

      - name: Determine composer cache directory
        run: echo "COMPOSER_CACHE_DIR=$(composer config cache-dir)" >> $GITHUB_ENV

      - name: Cache dependencies installed with composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}
          key: php8.4-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            php8.4-composer-

      - name: Install dependencies with composer
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader --ansi

      - name: Upload vendor artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vendor-php84
          path: vendor
          retention-days: 1

  # Same idea as `install` above, but for npm: node_modules doesn't depend
  # on which PHP version is running, only on the OS (some packages here --
  # esbuild, @playwright/test -- ship platform-specific native binaries),
  # so it's built once per OS and shared with every job that needs it on
  # that OS, instead of `sonar` plus all 4 `tests` matrix legs each running
  # their own `npm ci` (5 installs down to 2). ~350MB / ~18.7k files per
  # clean `npm ci`, a similar scale to vendor/'s ~564MB / ~37k files, which
  # the artifact approach already handles fine above, so the same
  # mechanism is used rather than introducing a second one.
  install-node-ubuntu:
    name: Install npm dependencies (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      # include-hidden-files: actions/upload-artifact defaults this to
      # false, which silently drops dotfiles -- and npm's per-package
      # executable shims live in node_modules/.bin, a dot-directory.
      # Confirmed live 2026-09-04: without this, the artifact uploaded
      # clean (no error, no warning) but .bin was entirely absent from it,
      # so every job downloading it failed on the first `npm run` script
      # that needed a binary (e.g. `sh: 1: vitest: not found`). vendor/
      # above doesn't hit this because Composer's bin dir is named `bin`,
      # not `.bin`.
      - name: Upload node_modules artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: node_modules-ubuntu
          path: node_modules
          retention-days: 1
          include-hidden-files: true

  install-node-windows:
    name: Install npm dependencies (windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      # See install-node-ubuntu's identical step above for why this needs
      # include-hidden-files: true (npm's node_modules/.bin is a
      # dot-directory, dropped silently by upload-artifact's default).
      - name: Upload node_modules artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: node_modules-windows
          path: node_modules
          retention-days: 1
          include-hidden-files: true

  sonar:
    name: SonarCloud
    needs: [install, install-node-ubuntu]
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install PHP with pcov
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: fileinfo, pdo, pdo_sqlite, intl, gd, openssl, dom, json, mbstring, curl, uopz, sodium, ctype
          tools: composer:v2
          coverage: pcov

      - name: Download vendor artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: vendor-php84
          path: vendor

      - name: Generate PHP coverage
        run: php -d memory_limit=512M vendor/bin/phpunit --coverage-clover coverage.xml --log-junit test-results.xml

      - name: Generate Testo coverage
        run: php -d memory_limit=512M vendor/bin/testo --suite=Unit --coverage-clover=coverage-testo.xml

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Download node_modules artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: node_modules-ubuntu
          path: node_modules

      - name: Generate TypeScript coverage
        run: npm run test:coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  tests:
    name: PHP ${{ matrix.php }}-${{ matrix.os }}
    # Needs `install` (the shared vendor/ artifact) and both node_modules
    # artifact jobs (each matrix leg picks whichever OS one it needs via
    # matrix.node-artifact below). Deliberately not `sonar` -- this job
    # doesn't consume anything sonar produces. It used to wait for sonar to
    # finish first regardless, which serialised roughly a full extra
    # SonarCloud run's worth of wall-clock time in front of every matrix
    # leg, including both windows-latest ones, for no actual dependency
    # reason.
    needs: [install, install-node-ubuntu, install-node-windows]

    env:
      extensions: apcu, fileinfo, pdo, pdo_sqlite, intl, gd, openssl, dom, json, mbstring, curl, uopz, sodium, ctype
      key: cache-v1
      YII_C3: true

    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        # PHP 8.6/9.0 workflow legs deliberately removed until 8.6 actually
        # releases — premature to carry a pre-release matrix leg for it
        # before then. windows-latest is paired explicitly with every PHP
        # version rather than a free os x php cross-product, so each
        # experimental leg carries its own flag.
        include:
          - os: ubuntu-latest
            php: '8.4'
            experimental: false
            node-artifact: node_modules-ubuntu
          - os: ubuntu-latest
            php: '8.5'
            experimental: false
            node-artifact: node_modules-ubuntu
          - os: windows-latest
            php: '8.4'
            experimental: false
            node-artifact: node_modules-windows
          - os: windows-latest
            php: '8.5'
            experimental: false
            node-artifact: node_modules-windows

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install PHP with extensions
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.extensions }}
          ini-values: date.timezone='UTC', max_execution_time=400, memory_limit=1024M
          tools: composer:v2
          coverage: pcov

      - name: Download vendor artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: vendor-php84
          path: vendor

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Download node_modules artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ matrix.node-artifact }}
          path: node_modules

  tests-alpine:
    name: PHP ${{ matrix.php }}-alpine${{ matrix.alpine }}

    runs-on: ubuntu-latest
    container:
      image: alpine:${{ matrix.alpine }}

    strategy:
      fail-fast: false
      matrix:
        # See invoice_dependency.yml's mutation-alpine job for why PHP and
        # Alpine versions are paired explicitly rather than a free matrix.
        # The php85/alpine:edge leg is temporarily disabled — see
        # invoice_static.yml's psalm-alpine job for the open upstream Psalm
        # bug (vimeo/psalm#11831) blocking it. Re-enable once that's fixed.
        include:
          - php: '84'
            alpine: '3.22'
          # - php: '85'
          #   alpine: 'edge'

    steps:
      # gcompat: actions/checkout and actions/cache are Node-based Actions;
      # the Node runtime GitHub injects into the container is glibc-linked,
      # which won't execute on musl libc without this.
      # tar: actions/cache always invokes `tar --posix` to build/restore its
      # archive. Alpine's default /bin/tar is BusyBox's minimal tar, which
      # doesn't support --posix at all ("unrecognized option: posix") --
      # confirmed live 2026-09-04, the cache-save step failing with exactly
      # that error on every run. Installing the real tar package replaces
      # what /bin/tar resolves to (Alpine's /bin is a symlink into /usr/bin
      # since the usrmerge Alpine adopted a few releases back), which is
      # GNU tar and does support --posix.
      - name: Install glibc compatibility layer and GNU tar
        run: apk add --no-cache gcompat tar

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # See invoice_dependency.yml's mutation-alpine job for why PHP/Composer
      # are set up directly via apk rather than shivammathur/setup-php.
      - name: Install PHP and extensions
        run: |
          apk add --no-cache \
            php${{ matrix.php }} \
            php${{ matrix.php }}-phar \
            php${{ matrix.php }}-bcmath \
            php${{ matrix.php }}-ctype \
            php${{ matrix.php }}-curl \
            php${{ matrix.php }}-dom \
            php${{ matrix.php }}-fileinfo \
            php${{ matrix.php }}-gd \
            php${{ matrix.php }}-iconv \
            php${{ matrix.php }}-intl \
            php${{ matrix.php }}-mbstring \
            php${{ matrix.php }}-openssl \
            php${{ matrix.php }}-pdo \
            php${{ matrix.php }}-pdo_sqlite \
            php${{ matrix.php }}-pecl-apcu \
            php${{ matrix.php }}-simplexml \
            php${{ matrix.php }}-sodium \
            php${{ matrix.php }}-tokenizer \
            php${{ matrix.php }}-xml \
            php${{ matrix.php }}-xmlreader \
            php${{ matrix.php }}-xmlwriter
          ln -sf /usr/bin/php${{ matrix.php }} /usr/bin/php
          php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
          php composer-setup.php --install-dir=/usr/local/bin --filename=composer
          rm composer-setup.php

      # ext-zend-opcache is a separate package on php84, but bundled
      # directly into the php85 apk package (no php85-opcache package
      # exists yet) — install it only where it exists as its own package.
      - name: Install ext-opcache (PHP 8.4 only)
        if: matrix.php == '84'
        run: apk add --no-cache php84-opcache

      - name: Set up Composer GitHub auth
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: composer config --global --auth github-oauth.github.com "$GITHUB_TOKEN"

      - name: Determine composer cache directory
        run: echo "COMPOSER_CACHE_DIR=$(composer config cache-dir)" >> $GITHUB_ENV

      - name: Cache dependencies installed with composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}
          key: php${{ matrix.php }}-alpine${{ matrix.alpine }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            php${{ matrix.php }}-alpine${{ matrix.alpine }}-composer-

      - name: Install dependencies with composer
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader --ansi

      # actions/setup-node has no documented Alpine/musl support either
      # (checked its README, same as shivammathur/setup-php) — Alpine's own
      # nodejs/npm apk packages are natively musl-built, so used directly.
      - name: Install Node.js and npm
        run: apk add --no-cache nodejs npm

      - name: Install dependencies with npm
        run: npm ci --ignore-scripts

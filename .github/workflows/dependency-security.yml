name: dependency security

on:
  pull_request:
    paths:
      - composer.json
      - composer.lock
      - package.json
      - package-lock.json
  push:
    branches: [ main ]
  schedule:
    - cron: '0 8 * * 1'

permissions:
  contents: read

jobs:
  dependency-review:
    # the dependency review action only understands pull_request events
    if: github.event_name == 'pull_request'
    name: GitHub dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  composer-audit:
    name: Composer audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
      # reads composer.lock directly: nothing is installed and no package scripts run;
      # exits non-zero when a known vulnerability is found
      - name: Audit locked dependencies
        run: composer audit --locked

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      # reads package-lock.json directly: nothing is installed and no package scripts run
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

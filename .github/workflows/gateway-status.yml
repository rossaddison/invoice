name: Gateway Status

on:
  schedule:
    # Every Monday at 03:00 UTC — an hour after benchmark.yml's 02:00 slot,
    # so the two scheduled jobs don't compete for the same runner window.
    - cron: '0 3 * * 1'
  workflow_dispatch: {}

# The repo's default GITHUB_TOKEN permission is read-only
# (Settings > Actions > General > Workflow permissions), so the
# "Commit results" step's `git push` gets a 403 without this explicit
# opt-in — scoped to just contents:write, not a repo-wide setting
# change. benchmark.yml's identical commit-back step likely has the
# same latent gap; not touched here, flagged separately.
permissions:
  contents: write

concurrency:
  group: gateway-status
  cancel-in-progress: false

jobs:
  check-sandboxes:
    name: Check gateway sandboxes
    runs-on: ubuntu-latest

    # Every `php yii ...` call builds the full app DI container, which
    # eagerly compiles the Cycle ORM schema for ALL registered database
    # connections (mysql "default" + the separate gateway_status SQLite
    # one) unless a cached runtime/schema.php is already present --
    # that cache is gitignored (see runtime/.gitignore) and regenerated
    # per-environment, so a fresh CI checkout never has one. This holds
    # even for gateway-status/check-sandboxes and gateway-status/rebuild,
    # neither of which ever touches the mysql connection themselves --
    # the schema build happens during container bootstrap, before the
    # command even runs. A real (empty) MySQL service is the least
    # surprising fix: it's what a first-ever local install already does
    # (see config/common/params.php's schema-providers comment), not a
    # workaround specific to this workflow.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: yii3_i
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: fileinfo, pdo, pdo_sqlite, pdo_mysql, intl, gd, openssl, dom, json, mbstring, curl, uopz, sodium, ctype
          coverage: none

      # This project's composer.json references several rossaddison/* forks
      # as VCS (not Packagist) repositories; resolving them hits GitHub's
      # API and needs auth to avoid the unauthenticated rate limit, same as
      # invoice_build.yml's "Set up Composer GitHub auth" step.
      - name: Set up Composer GitHub auth
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: composer config --global --auth github-oauth.github.com "$GITHUB_TOKEN"

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader --ansi

      # autoload.php (required by the ./yii console entrypoint every `php
      # yii ...` call below goes through) calls Dotenv::load(), not
      # safeLoad() — it throws a fatal InvalidPathException if no .env
      # file exists at all. .env is gitignored (it holds real secrets), so
      # a fresh CI checkout never has one; Tests/bootstrap.php and
      # benchmark.yml's run.php both sidestep this by never requiring the
      # root autoload.php, which is why this is the first workflow to hit
      # it. DB_HOST_IP_ADDRESS is overridden to 127.0.0.1 explicitly --
      # PDO's MySQL driver treats the default 'localhost' as "connect via
      # unix socket", which doesn't exist for a service container; only an
      # explicit IP forces a real TCP connection to the mysql service
      # above. DB_NAME/DB_USERNAME/DB_PASSWORD are left at their
      # .env.example defaults (blank -> 'yii3_i'/'root'/null in
      # config/common/params.php), matching the service's own
      # MYSQL_DATABASE/empty-password setup.
      - name: Create .env for console bootstrap
        run: |
          cp .env.example .env
          sed -i 's/^DB_HOST_IP_ADDRESS=.*/DB_HOST_IP_ADDRESS=127.0.0.1/' .env

      # Sandbox credentials are intentionally separate GitHub repo secrets
      # from this app's own production gateway credentials (which live
      # encrypted in the app's MySQL Setting table) — see
      # docs/GATEWAY_STATUS_PAGE_AUGUST_2026.md for the full naming
      # convention and rollout status. Any secret left unset here is
      # skipped gracefully by the command, not treated as a failure.
      #
      # TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID are a separate bot from this
      # app's own in-app Telegram integration (Setting table's
      # telegram_token/telegram_chat_id) — that one's for clients, this
      # one's a maintainer alert for expired sandbox credentials, and the
      # in-app Setting isn't reachable from CI anyway (no production DB).
      # Left unset until configured; the command skips the notification
      # gracefully, same as any other unset secret here.
      - name: Check gateway sandboxes
        env:
          STRIPE_SANDBOX_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
          MOLLIE_SANDBOX_API_KEY: ${{ secrets.MOLLIE_SANDBOX_API_KEY }}
          GOCARDLESS_SANDBOX_ACCESS_TOKEN: ${{ secrets.GOCARDLESS_SANDBOX_ACCESS_TOKEN }}
          SQUARE_SANDBOX_ACCESS_TOKEN: ${{ secrets.SQUARE_SANDBOX_ACCESS_TOKEN }}
          ADYEN_SANDBOX_API_KEY: ${{ secrets.ADYEN_SANDBOX_API_KEY }}
          ADYEN_SANDBOX_MERCHANT_ACCOUNT: ${{ secrets.ADYEN_SANDBOX_MERCHANT_ACCOUNT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: php yii gateway-status/check-sandboxes

      - name: Rebuild gateway status
        run: php yii gateway-status/rebuild

      # Raw git CLI, matching benchmark.yml's own commit-back pattern — no
      # git-auto-commit-action is used anywhere in this repo.
      - name: Commit results
        if: github.event_name != 'pull_request'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/gateway-status/
          if git diff --staged --quiet; then
            echo "Nothing to commit — gateway status unchanged."
          else
            git commit -m "chore: weekly gateway status check $(date -u +%Y-%m-%d)"
            git push
          fi

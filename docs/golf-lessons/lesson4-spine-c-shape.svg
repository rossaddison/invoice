<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 600 450" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="600" height="450" fill="#f0f7f0" rx="6"/>

  <!-- Header -->
  <rect width="600" height="56" fill="#1a3a1a" rx="6"/>
  <rect y="50" width="600" height="6" fill="#1a3a1a"/>
  <text x="300" y="26" text-anchor="middle" fill="white" font-size="16" font-weight="bold">LESSON 4: SWINGING WITH OR AGAINST THE SPINE</text>
  <text x="300" y="46" text-anchor="middle" fill="#8fbc8f" font-size="11">"C" spine = with tilt = Draw · "Reverse C" = against tilt = Cut</text>

  <!-- Divider -->
  <line x1="300" y1="62" x2="300" y2="390" stroke="#ccc" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- ===== LEFT: "C" SHAPE — DRAW ===== -->
  <text x="150" y="82" text-anchor="middle" fill="#0d6efd" font-size="14" font-weight="bold">"C" SPINE → DRAW</text>

  <!-- Target line (ground) -->
  <line x1="30" y1="385" x2="285" y2="385" stroke="#fd7e14" stroke-width="1.5" stroke-dasharray="6,3"/>
  <polygon points="285,385 273,380 273,390" fill="#fd7e14"/>
  <text x="40" y="378" fill="#fd7e14" font-size="10">target →</text>

  <!-- Ball left panel -->
  <circle cx="155" cy="385" r="8" fill="white" stroke="#555" stroke-width="2"/>

  <!-- Club path arrows (inside-out for draw) -->
  <path d="M 200 320 Q 175 355 155 370" fill="none" stroke="#0d6efd" stroke-width="3"/>
  <polygon points="153,372 145,360 157,362" fill="#0d6efd"/>
  <text x="205" y="318" fill="#0d6efd" font-size="9" font-weight="bold">inside-out</text>
  <text x="205" y="330" fill="#0d6efd" font-size="9">path → DRAW</text>

  <!-- Golfer LEFT — "C" shape at follow-through -->
  <!-- The spine CURVES AWAY from target at follow-through (classic C) -->
  <!-- Head -->
  <circle cx="155" cy="112" r="24" fill="#f5c5a0" stroke="#5a3a1a" stroke-width="2"/>
  <!-- Spine — curves LEFT (away from target) at finish = C shape -->
  <!-- Draw the curved spine as a path -->
  <path d="M 155 136 C 158 185 168 240 162 300 C 158 340 145 365 138 385"
        fill="none" stroke="#0d6efd" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <!-- "C" label on the spine curve -->
  <text x="188" y="265" fill="#0d6efd" font-size="42" font-weight="bold" opacity="0.25">C</text>
  <!-- Shoulders -->
  <line x1="110" y1="160" x2="200" y2="160" stroke="#2d6a4f" stroke-width="4" stroke-linecap="round"/>
  <!-- Arms at follow-through (high) -->
  <line x1="115" y1="162" x2="100" y2="120" stroke="#2d6a4f" stroke-width="3"/>
  <line x1="195" y1="162" x2="190" y2="130" stroke="#2d6a4f" stroke-width="3"/>
  <!-- Left leg straight (pressing through) -->
  <line x1="145" y1="310" x2="138" y2="388" stroke="#2d6a4f" stroke-width="3.5"/>
  <!-- Right leg (trail, heel up) -->
  <line x1="170" y1="310" x2="178" y2="370" stroke="#2d6a4f" stroke-width="3.5"/>
  <!-- Weight shift arrow toward target -->
  <path d="M 178 330 Q 160 340 138 350" fill="none" stroke="#fd7e14" stroke-width="2"/>
  <polygon points="136,352 130,341 142,342" fill="#fd7e14"/>
  <text x="82" y="358" fill="#fd7e14" font-size="9">weight</text>
  <text x="82" y="369" fill="#fd7e14" font-size="9">through</text>

  <!-- ===== RIGHT: "REVERSE C" — CUT ===== -->
  <text x="450" y="82" text-anchor="middle" fill="#dc3545" font-size="14" font-weight="bold">"REVERSE C" → CUT</text>

  <!-- Target line (ground) -->
  <line x1="315" y1="385" x2="570" y2="385" stroke="#fd7e14" stroke-width="1.5" stroke-dasharray="6,3"/>
  <polygon points="570,385 558,380 558,390" fill="#fd7e14"/>
  <text x="325" y="378" fill="#fd7e14" font-size="10">target →</text>

  <!-- Ball right panel -->
  <circle cx="450" cy="385" r="8" fill="white" stroke="#555" stroke-width="2"/>

  <!-- Club path arrows (outside-in for cut) -->
  <path d="M 490 310 Q 475 348 452 368" fill="none" stroke="#dc3545" stroke-width="3"/>
  <polygon points="450,370 442,358 454,360" fill="#dc3545"/>
  <text x="498" y="305" fill="#dc3545" font-size="9" font-weight="bold">outside-in</text>
  <text x="498" y="317" fill="#dc3545" font-size="9">path → CUT</text>

  <!-- Golfer RIGHT — "Reverse C" at follow-through -->
  <!-- Head tilts toward target -->
  <circle cx="450" cy="112" r="24" fill="#f5c5a0" stroke="#5a3a1a" stroke-width="2"/>
  <!-- Spine curves TOWARD target (reverse C) -->
  <path d="M 450 136 C 445 185 432 240 440 300 C 445 340 458 362 462 385"
        fill="none" stroke="#dc3545" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <!-- "Ↄ" hint for reverse C -->
  <text x="388" y="265" fill="#dc3545" font-size="42" font-weight="bold" opacity="0.25">Ↄ</text>
  <!-- Shoulders tilted toward target -->
  <line x1="405" y1="155" x2="495" y2="170" stroke="#2d6a4f" stroke-width="4" stroke-linecap="round"/>
  <!-- Arms (lower, cut finish) -->
  <line x1="410" y1="157" x2="400" y2="125" stroke="#2d6a4f" stroke-width="3"/>
  <line x1="490" y1="168" x2="485" y2="138" stroke="#2d6a4f" stroke-width="3"/>
  <!-- Legs -->
  <line x1="435" y1="310" x2="430" y2="388" stroke="#2d6a4f" stroke-width="3.5"/>
  <line x1="460" y1="310" x2="468" y2="375" stroke="#2d6a4f" stroke-width="3.5"/>

  <!-- Key points -->
  <rect x="10" y="396" width="580" height="48" fill="white" stroke="#c8e6c9" stroke-width="1.5" rx="5" opacity="0.9"/>
  <text x="22" y="413" fill="#1a3a1a" font-size="11" font-weight="bold">KEY POINTS</text>
  <text x="22" y="429" fill="#0d6efd" font-size="10">"C": spine tilts away from target at finish — weight fully transferred, club path from inside-out, promotes DRAW</text>
  <text x="22" y="443" fill="#dc3545" font-size="10">"Reverse C": spine tilts toward target — steeper outside-in path, club face open, promotes CUT / FADE</text>
</svg>

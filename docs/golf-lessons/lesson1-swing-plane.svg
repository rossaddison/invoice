<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 600 450" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="600" height="450" fill="#f0f7f0" rx="6"/>

  <!-- Header -->
  <rect width="600" height="56" fill="#1a3a1a" rx="6"/>
  <rect y="50" width="600" height="6" fill="#1a3a1a"/>
  <text x="300" y="26" text-anchor="middle" fill="white" font-size="16" font-weight="bold">LESSON 1: HORIZONTAL SWING PLANE</text>
  <text x="300" y="46" text-anchor="middle" fill="#8fbc8f" font-size="11">Bird's-eye view — Pronation back · Supination down &amp; through</text>

  <!-- Ground plane / mat (top-down) -->
  <ellipse cx="300" cy="255" rx="210" ry="62" fill="none" stroke="#4a8a4a" stroke-width="2" stroke-dasharray="7,4" opacity="0.7"/>
  <text x="300" y="335" text-anchor="middle" fill="#4a8a4a" font-size="11" font-style="italic">Swing arc — flat / horizontal plane</text>

  <!-- Target line -->
  <line x1="40" y1="255" x2="560" y2="255" stroke="#adb5bd" stroke-width="1.2" stroke-dasharray="10,5"/>
  <polygon points="560,255 548,250 548,260" fill="#fd7e14"/>
  <text x="558" y="248" fill="#fd7e14" font-size="10" font-weight="bold">TARGET</text>

  <!-- Ball at impact -->
  <circle cx="300" cy="255" r="10" fill="white" stroke="#444" stroke-width="2.5"/>
  <text x="300" y="278" text-anchor="middle" fill="#444" font-size="10">BALL</text>

  <!-- Golfer top-down (head + body oval) -->
  <ellipse cx="300" cy="264" rx="20" ry="28" fill="#2d6a4f" stroke="#1a3a1a" stroke-width="2"/>
  <circle cx="300" cy="248" r="16" fill="#f5c5a0" stroke="#5a3a1a" stroke-width="2"/>

  <!-- Club — backswing (to the right in top-down, trail side) -->
  <line x1="292" y1="252" x2="110" y2="210" stroke="#8B4513" stroke-width="4.5"/>
  <ellipse cx="101" cy="207" rx="16" ry="7" transform="rotate(-12,101,207)" fill="#666" stroke="#444" stroke-width="1.5"/>
  <text x="60" y="188" fill="#dc3545" font-size="13" font-weight="bold">BACKSWING</text>

  <!-- Pronation curved arrow -->
  <path d="M 125 178 A 22 22 0 0 0 98 198" fill="none" stroke="#dc3545" stroke-width="2.5"/>
  <polygon points="96,200 88,189 100,190" fill="#dc3545"/>
  <text x="50" y="223" fill="#dc3545" font-size="12" font-weight="bold">PRONATION</text>
  <text x="50" y="237" fill="#dc3545" font-size="10">Right hand</text>
  <text x="50" y="249" fill="#dc3545" font-size="10">rolls over left</text>

  <!-- Club — follow-through (to the left) -->
  <line x1="308" y1="252" x2="490" y2="210" stroke="#8B4513" stroke-width="4.5" stroke-dasharray="7,3" opacity="0.7"/>
  <ellipse cx="499" cy="207" rx="16" ry="7" transform="rotate(12,499,207)" fill="#bbb" stroke="#999" stroke-width="1.5"/>
  <text x="432" y="188" fill="#0d6efd" font-size="13" font-weight="bold">FOLLOW-THROUGH</text>

  <!-- Supination curved arrow -->
  <path d="M 474 178 A 22 22 0 0 1 501 198" fill="none" stroke="#0d6efd" stroke-width="2.5"/>
  <polygon points="503,200 511,189 499,190" fill="#0d6efd"/>
  <text x="442" y="223" fill="#0d6efd" font-size="12" font-weight="bold">SUPINATION</text>
  <text x="442" y="237" fill="#0d6efd" font-size="10">Left hand</text>
  <text x="442" y="249" fill="#0d6efd" font-size="10">rolls over right</text>

  <!-- Key points -->
  <rect x="10" y="358" width="580" height="80" fill="white" stroke="#c8e6c9" stroke-width="1.5" rx="5" opacity="0.9"/>
  <text x="22" y="375" fill="#1a3a1a" font-size="11" font-weight="bold">KEY POINTS</text>
  <text x="22" y="392" fill="#dc3545" font-size="10">● PRONATION (back): trail forearm rotates inward — club face opens naturally as it should</text>
  <text x="22" y="408" fill="#0d6efd" font-size="10">● SUPINATION (through): lead forearm rotates, squaring the face at impact — this is automatic if you pronate correctly going back</text>
  <text x="22" y="424" fill="#1a3a1a" font-size="10">● A FLAT plane keeps the face rotation smaller and more controllable than an upright plane</text>
</svg>

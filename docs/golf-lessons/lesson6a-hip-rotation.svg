<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 600 450" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="600" height="450" fill="#f0f7f0" rx="6"/>

  <!-- Header -->
  <rect width="600" height="56" fill="#1a3a1a" rx="6"/>
  <rect y="50" width="600" height="6" fill="#1a3a1a"/>
  <text x="300" y="26" text-anchor="middle" fill="white" font-size="16" font-weight="bold">LESSON 6A: HIP ROTATION — THE BIG MUSCLES</text>
  <text x="300" y="46" text-anchor="middle" fill="#8fbc8f" font-size="11">Hips initiate the downswing · Rotate onto the lead (press) foot · Trail heel rises</text>

  <!-- Divider line -->
  <line x1="300" y1="62" x2="300" y2="390" stroke="#ccc" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Labels -->
  <text x="150" y="80" text-anchor="middle" fill="#dc3545" font-size="13" font-weight="bold">① TOP OF BACKSWING</text>
  <text x="450" y="80" text-anchor="middle" fill="#0d6efd" font-size="13" font-weight="bold">② IMPACT / FOLLOW-THROUGH</text>

  <!-- Ground lines -->
  <line x1="30" y1="390" x2="270" y2="390" stroke="#888" stroke-width="2"/>
  <line x1="330" y1="390" x2="570" y2="390" stroke="#888" stroke-width="2"/>

  <!-- ========== LEFT: TOP OF BACKSWING ========== -->
  <!-- Head -->
  <circle cx="150" cy="110" r="26" fill="#f5c5a0" stroke="#5a3a1a" stroke-width="2"/>
  <!-- Neck & spine -->
  <line x1="150" y1="136" x2="150" y2="295" stroke="#2d6a4f" stroke-width="4.5"/>
  <!-- Shoulders (turned, right higher for backswing) -->
  <line x1="104" y1="160" x2="196" y2="148" stroke="#2d6a4f" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Left shoulder low (turned behind) -->
  <circle cx="104" cy="160" r="8" fill="#2d6a4f"/>
  <text x="76" y="157" fill="#2d6a4f" font-size="9" font-weight="bold">L</text>
  <circle cx="196" cy="148" r="8" fill="#dc3545"/>
  <text x="200" y="145" fill="#dc3545" font-size="9" font-weight="bold">R</text>

  <!-- Arms (backswing, club going up-right) -->
  <line x1="104" y1="160" x2="90" y2="125" stroke="#2d6a4f" stroke-width="3"/>
  <line x1="196" y1="148" x2="205" y2="125" stroke="#2d6a4f" stroke-width="3"/>
  <!-- Club going to top -->
  <line x1="96" y1="122" x2="70" y2="92" stroke="#8B4513" stroke-width="4"/>
  <polygon points="68,90 62,100 76,96" fill="#8B4513"/>

  <!-- HIPS — at top of backswing (slightly turned, weight on trail) -->
  <line x1="110" y1="295" x2="190" y2="290" stroke="#dc3545" stroke-width="6" stroke-linecap="round"/>
  <circle cx="110" cy="295" r="10" fill="#dc3545" opacity="0.8"/>
  <text x="88" y="314" fill="#dc3545" font-size="9">lead hip</text>
  <circle cx="190" cy="290" r="10" fill="#dc3545" opacity="0.5"/>
  <text x="192" y="307" fill="#dc3545" font-size="9">trail hip</text>
  <!-- Hip rotation label -->
  <text x="150" y="282" text-anchor="middle" fill="#dc3545" font-size="11" font-weight="bold">HIP LINE</text>

  <!-- Weight distribution: on trail foot -->
  <!-- Trail (right) foot carries weight -->
  <ellipse cx="185" cy="393" rx="25" ry="8" fill="#dc3545" opacity="0.3"/>
  <text x="185" y="405" text-anchor="middle" fill="#dc3545" font-size="9">60% weight</text>
  <!-- Lead (left) foot light -->
  <ellipse cx="105" cy="393" rx="22" ry="7" fill="#6c757d" opacity="0.2"/>
  <text x="105" y="405" text-anchor="middle" fill="#6c757d" font-size="9">40% weight</text>

  <!-- Legs — trail knee flexed, lead knee slight -->
  <line x1="118" y1="297" x2="108" y2="348" stroke="#2d6a4f" stroke-width="3.5"/>
  <line x1="108" y1="348" x2="100" y2="390" stroke="#2d6a4f" stroke-width="3.5"/>
  <line x1="180" y1="293" x2="192" y2="345" stroke="#2d6a4f" stroke-width="3.5"/>
  <line x1="192" y1="345" x2="190" y2="390" stroke="#2d6a4f" stroke-width="3.5"/>

  <!-- Foot shapes -->
  <rect x="82" y="388" width="38" height="8" rx="4" fill="#2d6a4f" stroke="#1a3a1a" stroke-width="1.5" opacity="0.8"/>
  <rect x="170" y="388" width="38" height="8" rx="4" fill="#2d6a4f" stroke="#1a3a1a" stroke-width="1.5" opacity="0.8"/>

  <!-- COIL label -->
  <text x="52" y="215" fill="#dc3545" font-size="12" font-weight="bold">MAX</text>
  <text x="52" y="228" fill="#dc3545" font-size="12" font-weight="bold">COIL</text>
  <path d="M 72 220 Q 88 230 96 245" fill="none" stroke="#dc3545" stroke-width="2"/>
  <polygon points="95,248 86,239 98,238" fill="#dc3545"/>

  <!-- ========== RIGHT: IMPACT — HIPS FIRING THROUGH ========== -->
  <!-- Head -->
  <circle cx="450" cy="110" r="26" fill="#f5c5a0" stroke="#5a3a1a" stroke-width="2"/>
  <!-- Spine (slight lateral tilt toward trail side at impact) -->
  <line x1="450" y1="136" x2="450" y2="295" stroke="#2d6a4f" stroke-width="4.5"/>
  <!-- Shoulders — open at impact / follow-through -->
  <line x1="404" y1="150" x2="496" y2="165" stroke="#2d6a4f" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="404" cy="150" r="8" fill="#0d6efd"/>
  <text x="384" y="147" fill="#0d6efd" font-size="9" font-weight="bold">L</text>
  <circle cx="496" cy="165" r="8" fill="#2d6a4f"/>
  <text x="500" y="162" fill="#2d6a4f" font-size="9">R</text>

  <!-- Arms extending through impact -->
  <line x1="404" y1="150" x2="388" y2="240" stroke="#2d6a4f" stroke-width="3"/>
  <line x1="496" y1="165" x2="412" y2="255" stroke="#2d6a4f" stroke-width="3"/>
  <!-- Club at impact / past -->
  <line x1="398" y1="243" x2="366" y2="388" stroke="#8B4513" stroke-width="4"/>
  <!-- Ball -->
  <circle cx="362" cy="392" r="8" fill="white" stroke="#555" stroke-width="2"/>
  <!-- Impact flash -->
  <circle cx="362" cy="390" r="13" fill="none" stroke="#fd7e14" stroke-width="2" stroke-dasharray="3,2" opacity="0.8"/>

  <!-- HIPS — fully rotated open (lead hip has cleared) -->
  <line x1="406" y1="285" x2="492" y2="300" stroke="#0d6efd" stroke-width="6" stroke-linecap="round"/>
  <circle cx="406" cy="285" r="10" fill="#0d6efd" opacity="0.9"/>
  <text x="380" y="305" fill="#0d6efd" font-size="9" font-weight="bold">lead hip</text>
  <text x="380" y="316" fill="#0d6efd" font-size="9">CLEARED</text>
  <circle cx="492" cy="300" r="10" fill="#0d6efd" opacity="0.5"/>
  <text x="494" y="317" fill="#6c757d" font-size="9">trail hip</text>

  <!-- BIG HIP ROTATION ARROW -->
  <path d="M 440 265 A 35 20 0 0 1 460 268" fill="none" stroke="#0d6efd" stroke-width="3"/>
  <polygon points="462,266 456,258 462,275" fill="#0d6efd"/>
  <text x="440" y="255" text-anchor="middle" fill="#0d6efd" font-size="11" font-weight="bold">HIPS FIRE</text>
  <text x="440" y="267" text-anchor="middle" fill="#0d6efd" font-size="10">first!</text>

  <!-- Weight now on lead foot -->
  <ellipse cx="402" cy="393" rx="25" ry="8" fill="#0d6efd" opacity="0.3"/>
  <text x="402" y="405" text-anchor="middle" fill="#0d6efd" font-size="9">80% weight</text>
  <!-- Trail heel up -->
  <ellipse cx="488" cy="385" rx="18" ry="6" fill="#6c757d" opacity="0.2"/>
  <text x="488" y="397" text-anchor="middle" fill="#6c757d" font-size="9">heel UP</text>

  <!-- Legs — lead leg straight, trail heel rising -->
  <line x1="416" y1="297" x2="406" y2="348" stroke="#2d6a4f" stroke-width="3.5"/>
  <line x1="406" y1="348" x2="402" y2="390" stroke="#2d6a4f" stroke-width="3.5"/>
  <!-- Lead foot planted flat -->
  <rect x="384" y="388" width="38" height="8" rx="4" fill="#0d6efd" stroke="#0a4fc4" stroke-width="1.5" opacity="0.9"/>
  <!-- Trail leg — heel up -->
  <line x1="478" y1="302" x2="490" y2="348" stroke="#2d6a4f" stroke-width="3.5"/>
  <line x1="490" y1="348" x2="492" y2="378" stroke="#2d6a4f" stroke-width="3.5"/>
  <!-- Trail foot on toe only -->
  <rect x="490" y="376" width="24" height="7" rx="3" fill="#2d6a4f" stroke="#1a3a1a" stroke-width="1.5" opacity="0.7"/>
  <!-- Heel up arrow -->
  <path d="M 476 384 Q 478 374 482 370" fill="none" stroke="#fd7e14" stroke-width="2"/>
  <polygon points="483,368 477,360 488,362" fill="#fd7e14"/>
  <text x="505" y="370" fill="#fd7e14" font-size="9">heel</text>
  <text x="505" y="381" fill="#fd7e14" font-size="9">rising</text>

  <!-- Key points -->
  <rect x="10" y="408" width="580" height="38" fill="white" stroke="#c8e6c9" stroke-width="1.5" rx="5" opacity="0.9"/>
  <text x="22" y="422" fill="#1a3a1a" font-size="11" font-weight="bold">KEY POINTS</text>
  <text x="22" y="436" fill="#0d6efd" font-size="10">HIPS LEAD: Start down by pressing the lead foot into the ground and rotating the big muscles first — arms and club follow. Trail heel rises naturally as hips clear.</text>
</svg>

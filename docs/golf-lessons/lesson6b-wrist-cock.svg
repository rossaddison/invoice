<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 600 450" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="600" height="450" fill="#f0f7f0" rx="6"/>

  <!-- Header -->
  <rect width="600" height="56" fill="#1a3a1a" rx="6"/>
  <rect y="50" width="600" height="6" fill="#1a3a1a"/>
  <text x="300" y="26" text-anchor="middle" fill="white" font-size="16" font-weight="bold">LESSON 6B: WRIST COCK &amp; ANGLE OF ATTACK</text>
  <text x="300" y="46" text-anchor="middle" fill="#8fbc8f" font-size="11">Cock the club to point at the ball · Flexion (bowed) = shallow · Extension (cupped) = steep</text>

  <!-- Three panels: COCK / BOWED / CUPPED -->
  <line x1="200" y1="62" x2="200" y2="398" stroke="#ccc" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="400" y1="62" x2="400" y2="398" stroke="#ccc" stroke-width="1.5" stroke-dasharray="6,4"/>

  <text x="100" y="80" text-anchor="middle" fill="#1a3a1a" font-size="12" font-weight="bold">① WRIST COCK</text>
  <text x="300" y="80" text-anchor="middle" fill="#0d6efd" font-size="12" font-weight="bold">② BOWED (FLEXION)</text>
  <text x="500" y="80" text-anchor="middle" fill="#dc3545" font-size="12" font-weight="bold">③ CUPPED (EXTENSION)</text>

  <!-- Ground lines -->
  <line x1="20" y1="390" x2="180" y2="390" stroke="#888" stroke-width="1.5"/>
  <line x1="210" y1="390" x2="390" y2="390" stroke="#888" stroke-width="1.5"/>
  <line x1="410" y1="390" x2="580" y2="390" stroke="#888" stroke-width="1.5"/>

  <!-- ========== PANEL 1: WRIST COCK — top of backswing ========== -->
  <!-- Side view of golfer at top -->
  <!-- Head (profile) -->
  <circle cx="100" cy="115" r="22" fill="#f5c5a0" stroke="#5a3a1a" stroke-width="2"/>
  <!-- Spine -->
  <line x1="100" y1="137" x2="100" y2="310" stroke="#2d6a4f" stroke-width="4"/>
  <!-- Shoulders -->
  <line x1="70" y1="155" x2="130" y2="155" stroke="#2d6a4f" stroke-width="4" stroke-linecap="round"/>
  <!-- Upper arm -->
  <line x1="78" y1="157" x2="70" y2="215" stroke="#2d6a4f" stroke-width="3.5"/>
  <!-- Forearm (horizontal at top of backswing) -->
  <line x1="70" y1="215" x2="130" y2="208" stroke="#2d6a4f" stroke-width="3.5"/>
  <!-- Wrist joint -->
  <circle cx="130" cy="208" r="7" fill="#fd7e14" stroke="#e0610a" stroke-width="2"/>
  <!-- COCK: shaft drops 90° from forearm — pointing DOWN toward ball -->
  <line x1="130" y1="208" x2="130" y2="320" stroke="#8B4513" stroke-width="5"/>
  <ellipse cx="130" cy="322" rx="16" ry="7" fill="#666" stroke="#444" stroke-width="1.5"/>
  <!-- Angle marker at wrist -->
  <path d="M 130 195 L 130 208 L 143 208" fill="none" stroke="#fd7e14" stroke-width="2"/>
  <text x="145" y="205" fill="#fd7e14" font-size="10" font-weight="bold">≈90°</text>
  <!-- CLUB POINTING TO BALL arrow -->
  <path d="M 148 270 Q 142 295 136 318" fill="none" stroke="#fd7e14" stroke-width="2"/>
  <polygon points="135,320 126,310 138,309" fill="#fd7e14"/>
  <text x="150" y="260" fill="#fd7e14" font-size="10" font-weight="bold">Club points</text>
  <text x="150" y="272" fill="#fd7e14" font-size="10" font-weight="bold">at ball!</text>
  <!-- Ball on ground -->
  <circle cx="100" cy="392" r="7" fill="white" stroke="#555" stroke-width="2"/>
  <!-- Sight line from club head to ball -->
  <line x1="130" y1="330" x2="107" y2="390" stroke="#fd7e14" stroke-width="1.5" stroke-dasharray="5,3"/>
  <!-- Hips / legs (simplified) -->
  <line x1="88" y1="310" x2="82" y2="390" stroke="#2d6a4f" stroke-width="3"/>
  <line x1="112" y1="310" x2="118" y2="390" stroke="#2d6a4f" stroke-width="3"/>

  <!-- ========== PANEL 2: BOWED LEAD WRIST (FLEXION) — shallow attack ========== -->
  <!-- BOWED = lead wrist dorsiflexed / knuckles toward target at impact -->
  <!-- Side view forearm + hand close-up -->
  <!-- Forearm -->
  <line x1="222" y1="180" x2="320" y2="185" stroke="#2d6a4f" stroke-width="9" stroke-linecap="round"/>
  <!-- Wrist bowing DOWN (toward ground) — knuckles face outward -->
  <path d="M 320 185 Q 338 192 345 185" fill="none" stroke="#0d6efd" stroke-width="6" stroke-linecap="round"/>
  <!-- Hand (bowed position) -->
  <ellipse cx="355" cy="183" rx="22" ry="14" fill="#f5c5a0" stroke="#5a3a1a" stroke-width="2"/>
  <!-- Knuckles visible (facing outward/target) -->
  <circle cx="344" cy="172" r="4" fill="#e8b090" stroke="#c09070" stroke-width="1"/>
  <circle cx="356" cy="170" r="4" fill="#e8b090" stroke="#c09070" stroke-width="1"/>
  <circle cx="368" cy="172" r="4" fill="#e8b090" stroke="#c09070" stroke-width="1"/>
  <!-- Bowed wrist label -->
  <path d="M 248 175 Q 240 160 252 148" fill="none" stroke="#0d6efd" stroke-width="2.5"/>
  <polygon points="253,145 244,140 248,153" fill="#0d6efd"/>
  <text x="255" y="142" fill="#0d6efd" font-size="10" font-weight="bold">BOWED</text>
  <text x="255" y="154" fill="#0d6efd" font-size="10">(flexion)</text>
  <!-- Grip + shaft angled -->
  <line x1="350" y1="195" x2="370" y2="350" stroke="#8B4513" stroke-width="5"/>
  <!-- SHALLOW attack angle arrow -->
  <path d="M 305 370 Q 340 355 370 338" fill="none" stroke="#0d6efd" stroke-width="2.5"/>
  <polygon points="372,336 364,326 376,328" fill="#0d6efd"/>
  <text x="245" y="345" fill="#0d6efd" font-size="11" font-weight="bold">SHALLOW</text>
  <text x="245" y="358" fill="#0d6efd" font-size="10">attack angle</text>
  <text x="245" y="370" fill="#0d6efd" font-size="10">→ DRAW / lower</text>
  <!-- Ball -->
  <circle cx="365" cy="392" r="7" fill="white" stroke="#555" stroke-width="2"/>
  <!-- Attack angle line (shallow) -->
  <line x1="370" y1="350" x2="368" y2="392" stroke="#0d6efd" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="248" y="388" fill="#0d6efd" font-size="9">Face closed → DRAW</text>
  <!-- Closed face indicator -->
  <rect x="368" y="350" width="18" height="6" rx="2" fill="#0d6efd" opacity="0.6" transform="rotate(-10,377,353)"/>

  <!-- ========== PANEL 3: CUPPED LEAD WRIST (EXTENSION) — steep attack ========== -->
  <!-- Forearm -->
  <line x1="422" y1="180" x2="520" y2="175" stroke="#2d6a4f" stroke-width="9" stroke-linecap="round"/>
  <!-- Wrist cupping UP (extension) -->
  <path d="M 520 175 Q 535 165 545 175" fill="none" stroke="#dc3545" stroke-width="6" stroke-linecap="round"/>
  <!-- Hand (cupped / knuckles toward body) -->
  <ellipse cx="555" cy="178" rx="22" ry="14" fill="#f5c5a0" stroke="#5a3a1a" stroke-width="2"/>
  <!-- Cupped wrist = knuckles rotated back -->
  <circle cx="545" cy="168" r="4" fill="#e8b090" stroke="#c09070" stroke-width="1"/>
  <circle cx="557" cy="168" r="4" fill="#e8b090" stroke="#c09070" stroke-width="1"/>
  <!-- Cupped label -->
  <path d="M 445 168 Q 440 150 452 138" fill="none" stroke="#dc3545" stroke-width="2.5"/>
  <polygon points="454,135 445,130 449,143" fill="#dc3545"/>
  <text x="455" y="130" fill="#dc3545" font-size="10" font-weight="bold">CUPPED</text>
  <text x="455" y="142" fill="#dc3545" font-size="10">(extension)</text>
  <!-- Grip + shaft — STEEP angle -->
  <line x1="550" y1="188" x2="530" y2="350" stroke="#8B4513" stroke-width="5"/>
  <!-- STEEP attack angle arrow -->
  <path d="M 470 320 Q 500 335 525 345" fill="none" stroke="#dc3545" stroke-width="2.5"/>
  <polygon points="527,347 518,338 530,337" fill="#dc3545"/>
  <text x="415" y="310" fill="#dc3545" font-size="11" font-weight="bold">STEEP</text>
  <text x="415" y="323" fill="#dc3545" font-size="10">attack angle</text>
  <text x="415" y="335" fill="#dc3545" font-size="10">→ CUT / higher</text>
  <!-- Ball -->
  <circle cx="528" cy="392" r="7" fill="white" stroke="#555" stroke-width="2"/>
  <!-- Attack angle line (steep) -->
  <line x1="530" y1="350" x2="530" y2="392" stroke="#dc3545" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="415" y="388" fill="#dc3545" font-size="9">Face open → CUT</text>
  <!-- Open face indicator -->
  <rect x="528" y="352" width="18" height="6" rx="2" fill="#dc3545" opacity="0.6" transform="rotate(15,537,355)"/>

  <!-- Key points -->
  <rect x="10" y="405" width="580" height="40" fill="white" stroke="#c8e6c9" stroke-width="1.5" rx="5" opacity="0.9"/>
  <text x="22" y="419" fill="#1a3a1a" font-size="11" font-weight="bold">KEY POINTS</text>
  <text x="22" y="435" fill="#0d6efd" font-size="10">COCK at 90° so club points at ball (panel 1). BOWED lead wrist at impact = shallower attack, closed face = DRAW. CUPPED = steeper, open face = CUT.</text>
</svg>
